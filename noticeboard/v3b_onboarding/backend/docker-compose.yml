name: noticeboard-v3b

services:
  db:
    image: postgres:16-alpine
    container_name: noticeboard-v3b-db
    environment:
      POSTGRES_USER: noticeboard
      POSTGRES_PASSWORD: noticeboard
      POSTGRES_DB: noticeboard
    ports:
      - "5435:5432"   # 5432-5434 belong to the MVP, v2 and v3; v3b gets its own port and data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noticeboard -d noticeboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
