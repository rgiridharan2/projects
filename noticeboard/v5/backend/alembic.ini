[alembic]
script_location = %(here)s/alembic
# Makes `import app` work when alembic runs from this folder.
prepend_sys_path = %(here)s
path_separator = os
# Migration files are named like 0001_initial_schema.py
file_template = %%(rev)s_%%(slug)s
# Left empty on purpose: alembic/env.py reads DATABASE_URL from app/config.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
